name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Demo: force an unhealthy release to watch auto-rollback"
        type: choice
        options: ["none", "candidate", "live"]
        default: "none"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ 1. TEST
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (fails under 90% coverage)
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------- 2. BUILD, SCAN, PUBLISH
  build:
    name: Build, scan & publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          tag="sha-${GITHUB_SHA::7}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build once, load into the local daemon so we can scan BEFORE anything is published.
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy scan (gate: fail on fixable HIGH/CRITICAL)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Always produce a SARIF report for the Security tab, even when the gate above failed.
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only images that passed tests AND the scan are ever pushed (layers come from cache).
      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: GIT_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  # ---------------------------------------------------------------- 3. DEPLOY
  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production          # add required reviewers in repo Settings > Environments for manual approval
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship deploy scripts
        run: |
          ssh "$TARGET" 'mkdir -p ~/app/scripts'
          scp scripts/deploy.sh scripts/rollback.sh "$TARGET:~/app/scripts/"

      - name: Let the server pull from GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy (pre-flight gate + auto-rollback on server)
        id: deploy
        run: |
          sim="${{ github.event.inputs.simulate_failure || 'none' }}"
          [ "$sim" = "none" ] && sim=""
          ssh "$TARGET" "SIMULATE_FAILURE_STAGE='$sim' bash ~/app/scripts/deploy.sh '$IMAGE' '$TAG'"

      # Second safety net: verify from outside the server, roll back if that fails.
      - name: External smoke test
        id: smoke
        if: vars.DEPLOY_URL != ''
        run: |
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 5 "${{ vars.DEPLOY_URL }}/health" || true)"
            echo "attempt $i: $body"
            if grep -Eq '"status": ?"ok"' <<<"$body" && grep -Fq "\"$TAG\"" <<<"$body"; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Roll back (smoke test failed)
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: ssh "$TARGET" "bash ~/app/scripts/rollback.sh '$IMAGE'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo "- Image: \`$IMAGE:$TAG\`"
            echo "- Deploy step: \`${{ steps.deploy.outcome }}\`"
            echo "- Smoke test: \`${{ steps.smoke.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
