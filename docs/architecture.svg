<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
<rect width="100%" height="100%" rx="16" fill="#0f172a"/>
<text x="30" y="42" font-size="24" font-weight="700" fill="#f8fafc">Automated Software Delivery Pipeline</text>
<text x="30" y="68" font-size="14" fill="#94a3b8">GitHub Actions · Docker · Python · Trivy · GHCR</text>
<rect x="30" y="90" width="200" height="80" rx="12" fill="#2563eb"/>
<text x="130" y="122" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1 · TEST</text>
<text x="130" y="146" font-size="12" fill="#e2e8f0" text-anchor="middle">ruff · pytest ≥90%</text>
<rect x="270" y="90" width="200" height="80" rx="12" fill="#7c3aed"/>
<text x="370" y="122" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2 · BUILD + SCAN</text>
<text x="370" y="146" font-size="12" fill="#e2e8f0" text-anchor="middle">Trivy HIGH / CRITICAL</text>
<rect x="510" y="90" width="200" height="80" rx="12" fill="#059669"/>
<text x="610" y="122" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3 · PUBLISH</text>
<text x="610" y="146" font-size="12" fill="#e2e8f0" text-anchor="middle">GHCR · sha-<7> tag</text>
<rect x="30" y="210" width="200" height="80" rx="12" fill="#0891b2"/>
<text x="130" y="242" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4 · DEPLOY</text>
<text x="130" y="266" font-size="12" fill="#e2e8f0" text-anchor="middle">pre-flight health check</text>
<rect x="270" y="210" width="200" height="80" rx="12" fill="#dc2626"/>
<text x="370" y="242" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5 · VERIFY</text>
<text x="370" y="266" font-size="12" fill="#e2e8f0" text-anchor="middle">smoke test · rollback</text>
<rect x="510" y="210" width="200" height="80" rx="12" fill="#ea580c"/>
<text x="610" y="242" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Manual rollback</text>
<text x="610" y="266" font-size="12" fill="#e2e8f0" text-anchor="middle">any tag · scripts/rollback.sh</text>
</svg>